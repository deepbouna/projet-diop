<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestion de Contacts</title>
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>

  <header>
    <h1>Mes Contacts</h1>
    <button id="btn-sync" onclick="syncContacts()">Synchroniser</button>
  </header>

  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Rechercher un contact..." oninput="searchContacts()" />
  </div>

  <div id="toolbar">
    <button id="btn-add" onclick="showForm()">+ Ajouter un contact</button>
  </div>

  <div id="contact-list"></div>

  <div id="form-overlay" class="hidden">
    <div id="form-container">
      <h2 id="form-title">Nouveau contact</h2>
      <input type="hidden" id="contact-id" />
      <label>Prénom</label>
      <input type="text" id="input-prenom" placeholder="Prénom" />
      <label>Nom</label>
      <input type="text" id="input-nom" placeholder="Nom" />
      <label>Téléphone</label>
      <input type="tel" id="input-tel" placeholder="Téléphone" />
      <label>Email</label>
      <input type="email" id="input-email" placeholder="Email" />
      <div id="form-buttons">
        <button onclick="saveContact()">Enregistrer</button>
        <button class="btn-cancel" onclick="hideForm()">Annuler</button>
      </div>
    </div>
  </div>

  <div id="sync-status" class="hidden"></div>

  <script src="cordova.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
