<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, height=device-height">
    <title>IMC CALCULATOR</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app-container">
        <h1>IMC CALCULATOR</h1>
        
        <div class="form-group">
            <label for="poids">Poids (en kg) :</label>
            <input type="number" id="poids" placeholder="Poids en kg" >
        </div>

        <div class="form-group">
            <label for="taille">Taille (en cm) :</label>
            <input type="number" id="taille" placeholder="Taille en cm">
        </div>

        <button id="btn-calculer">Calculer l'IMC</button>

        <div id="resultat-container" style="display: none;">
            <h3>Votre IMC est : <span id="valeur-imc">0.0</span></h3>
            <p id="interpretation"></p>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
